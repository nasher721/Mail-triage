[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage-python"
version = "0.1.0"
description = "Outlook email triage with local Ollama screening and an agent that files mail and drafts replies"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
owa = ["playwright>=1.40"]

[project.scripts]
email-triage = "email_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
